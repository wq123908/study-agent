[project]
name = "study-agent"
version = "0.2.0"
description = "从零手写的企业级 AI Agent 引擎：流式 ReAct、分层记忆、声明式工具、HITL 审批、全链路追踪与自动化评测"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
tokens = ["tiktoken>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
